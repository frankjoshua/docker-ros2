---
name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main
  schedule:
    # Run once a month
    - cron: '1 2 3 * *'

env:
  DOCKER_CONTAINER: frankjoshua/ros2

jobs:
  docker:
    name: Docker (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest stays on humble so existing FROM frankjoshua/ros2 images don't change distro
          - distro: humble
            latest: true
          - distro: jazzy
            latest: false
          - distro: lyrical
            latest: false
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push image to DockerHub
        run: |
          TAGS="-t $DOCKER_CONTAINER:${{ matrix.distro }}"
          if [[ "${{ matrix.latest }}" == "true" ]]; then
            TAGS="$TAGS -t $DOCKER_CONTAINER:latest"
          fi
          ./build.sh $TAGS -d ${{ matrix.distro }} -p -a linux/arm64,linux/amd64
